name: Update dashboard

# The page already reads the sheets live; this keeps the saved copy fresh
# for the first paint and for when the live link is unreachable.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix build
      - id: build
        run: node build/build.mjs
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          LIVE_URL: ${{ secrets.LIVE_URL }}
      - if: steps.build.outputs.stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update ${{ steps.build.outputs.stamp }}"
          git push
