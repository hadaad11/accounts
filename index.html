<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1b2d">
<title>لوحة الحسابات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f6f7f9; --ink:#0f172a; --ink-2:#334155; --muted:#667085; --line:#e4e7ec; --line-2:#eef0f3;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#e3f2ef;
  --pos:#15803d; --pos-soft:#e7f5ec; --neg:#c2410c; --neg-soft:#fdf0e8; --warn:#b45309; --warn-soft:#fdf4e3;
  --hero:#0f1b2d; --hero-2:#16263d; --hero-ink:#f1f5f9; --hero-muted:#9fb0c6;
  --c1:#0d7a6f; --c2:#2f6fdc; --c3:#7c5cd6; --c4:#d08a0b; --c5:#64748b; --c6:#cf3f7a;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(15,23,42,.12);
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#0a0f17; --surface:#111925; --surface-2:#16202e; --ink:#e7ecf3; --ink-2:#c3ccd8; --muted:#8b98ab; --line:#223044; --line-2:#1b2738;
  --accent:#2bb3a3; --accent-ink:#04201c; --accent-soft:#0f2d2a;
  --pos:#3ccb7f; --pos-soft:#11291d; --neg:#f28c52; --neg-soft:#2e1b10; --warn:#f0b44c; --warn-soft:#2c220f;
  --hero:#16263d; --hero-2:#1c3150; --hero-ink:#f1f5f9; --hero-muted:#a8b8cc;
  --c1:#2bb3a3; --c2:#5b95f0; --c3:#a08bf0; --c4:#e7a93a; --c5:#94a3b8; --c6:#ec6fa2;
  --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.6em;color:var(--muted);font-weight:500;margin-inline-start:4px}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
svg{flex:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 20px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--hero);color:#fff;display:grid;place-items:center}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px 11px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--muted)}

.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 64px}
.panel{display:none}.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:12.5px}
.panel-meta .src{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.wa:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- cards & kpis ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15.5px;margin:0;font-weight:700}
.card .desc{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head .desc{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi .val{font-size:27px;font-weight:700;margin-top:6px;line-height:1.2;letter-spacing:-.3px}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.hero{background:linear-gradient(150deg,var(--hero-2),var(--hero));color:var(--hero-ink);border-color:transparent}
.kpi.hero::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c1) 45%,transparent),transparent 70%);opacity:.55}
.kpi.hero .lbl,.kpi.hero .hint,.kpi.hero .cur{color:var(--hero-muted)}

.grid{display:grid;gap:14px;margin-bottom:14px}
.g-2{grid-template-columns:1.35fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.full{grid-column:1/-1}
h3.sec{margin:28px 2px 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
h3.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:110px 1fr 132px;align-items:center;gap:12px;font-size:13.5px}
.bar-row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-row .amt{text-align:left;font-weight:700}
.bar-row .pct{color:var(--muted);font-weight:500;font-size:11.5px;margin-inline-end:8px}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;min-width:170px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .l-amt{margin-inline-start:auto;color:var(--muted);font-weight:600}

.stack{display:flex;height:36px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.eq{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--muted);margin-top:14px}
.eq b{color:var(--ink);font-size:15px}

.co-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.co-name{font-size:16.5px;font-weight:700}
.co-total{font-size:20px;font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-top:4px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line-2);text-align:right}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--surface-2);position:sticky;top:0}
th:first-child{border-start-start-radius:8px;border-end-start-radius:8px}
th:last-child{border-start-end-radius:8px;border-end-end-radius:8px}
th,td{white-space:nowrap}
td.wrap-t{white-space:normal;min-width:160px}
td.v,th.v{text-align:left}
td.num{display:table-cell;direction:ltr;text-align:left}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.tot td{border-top:1.5px solid var(--line);font-weight:700;background:transparent}
.em{font-weight:700;color:var(--pos)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.tag.co{background:var(--accent-soft);color:var(--accent)}
.tag.pe{background:color-mix(in srgb,var(--c2) 14%,var(--surface));color:var(--c2)}
.tag.db{background:var(--neg-soft);color:var(--neg)}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.note b{color:var(--ink)}
.progress{height:8px;border-radius:5px;background:var(--neg-soft);overflow:hidden;margin:8px 0 6px}
.progress div{height:100%;background:var(--pos);border-radius:5px;width:0;transition:width .9s}
.pp{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini span{font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:2px 9px}

/* search / filters */
.tools-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:9px 38px 9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select.sel{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.empty-state{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:12px}

/* calc */
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 14px}
.calc .part{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:6px 12px;text-align:center;cursor:text}
.calc .part input{min-width:6ch;max-width:16ch;border:1px dashed var(--line);background:var(--surface);font-weight:700;font-size:15.5px;text-align:center;
  direction:ltr;border-radius:8px;padding:2px 6px;margin-top:2px;font-variant-numeric:tabular-nums}
.calc .part input:focus{outline:none;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.calc .part input.changed{border:1px solid var(--warn);background:var(--warn-soft)}
.calc .part small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.calc .op{color:var(--muted);font-weight:700;font-size:16px}
.calc-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.calc-total>span{color:var(--muted);font-size:13px;font-weight:600}
.calc-total b{font-size:21px;font-weight:700}
.calc-total b.chg{color:var(--warn)}
.whatif{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px;padding:10px 14px;
  border-radius:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);font-size:13px;font-weight:600}

/* waterfall */
.wf{display:flex;flex-direction:column;gap:10px}
.wf-row{display:grid;grid-template-columns:120px 1fr 130px;gap:12px;align-items:center;font-size:13.5px}
.wf-row .name{font-weight:600}
.wf-row .track{height:20px;border-radius:6px}
.wf-seg{position:absolute;top:0;bottom:0;border-radius:5px;transition:width .9s}
.wf-row .amt{text-align:left;font-weight:700}
.wf-row.res{border-top:1px dashed var(--line);padding-top:10px}

/* ---------- price list / work guide ---------- */
.pl{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.pitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.pitem{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);display:flex;flex-direction:column;gap:2px;
  transition:border-color .15s,box-shadow .15s;position:relative}
.pitem:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pitem.inq{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pitem.empty{background:var(--surface-2);border-style:dashed}
.pname{font-weight:700;font-size:15px;line-height:1.35}
.punit{color:var(--muted);font-size:12px}
.pprice{font-size:21px;font-weight:700;margin-top:6px;cursor:copy;align-self:flex-start}
.pitem.empty .pprice{font-size:13px;font-weight:600;color:var(--warn);cursor:default}
.pnote{margin-top:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.pfoot{margin-top:auto;padding-top:10px;display:flex;justify-content:flex-end}
.add{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.add:hover{border-color:var(--accent);color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:9px;overflow:hidden;background:var(--accent-soft)}
.stepper button{border:0;background:none;width:30px;height:30px;font-size:17px;font-weight:700;color:var(--accent);cursor:pointer}
.stepper input{width:46px;border:0;background:transparent;text-align:center;font-weight:700;font-size:14px;direction:ltr;outline:none;color:var(--accent)}
mark{background:color-mix(in srgb,var(--c4) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}

.quote{position:sticky;top:120px}
.quote .q-empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:12px}
.q-field{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;outline:none;margin-bottom:10px}
.q-field:focus{border-color:var(--accent);background:var(--surface)}
.q-lines{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;margin:0 -4px;padding:0 4px}
.q-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.q-line .qn{font-weight:600}
.q-line .qd{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.q-line .qd input{width:56px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);text-align:center;direction:ltr;font-size:12.5px}
.q-line .qt{font-weight:700;text-align:left;grid-row:span 2;align-self:center;display:flex;align-items:center;gap:6px}
.q-x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;display:grid;place-items:center}
.q-x:hover{color:var(--neg);background:var(--neg-soft)}
.q-sum{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.q-sum div{display:flex;justify-content:space-between;align-items:center}
.q-sum .disc input{width:64px;padding:3px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);text-align:center;direction:ltr}
.q-grand{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:14px;font-weight:700}
.q-grand b{font-size:22px}
.q-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.q-actions .btn{justify-content:center}
.q-actions .full{grid-column:1/-1}

.qbar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:none;align-items:center;justify-content:space-between;gap:10px;
  background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-lg);cursor:pointer;border:0;font-weight:600;font-size:14px}
.qbar b{font-size:17px}
.qbar .cnt{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 9px;font-size:12px;margin-inline-end:6px}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);
  padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}

/* ---------- lock ---------- */
#lock{min-height:100vh;min-height:100dvh;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--c1) 18%,transparent),transparent 60%),var(--bg)}
#lock form{width:100%;max-width:370px;text-align:center;padding:30px 26px;box-shadow:var(--shadow-lg)}
#lock h1{font-size:21px;margin:14px 0 2px;font-weight:700}
#lock .sub{color:var(--muted);font-size:13px}
.pw-box{position:relative;margin:20px 0 8px}
.pw-box input{width:100%;font-size:16px;padding:12px 44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;direction:ltr;outline:none}
.pw-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.pw-eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;display:grid}
#lock .go{width:100%;padding:12px;font-size:15px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;cursor:pointer;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:8px}
#lock .go:disabled{opacity:.7}
#lock label{display:flex;gap:7px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-top:14px;cursor:pointer}
#lock label input{accent-color:var(--accent);width:16px;height:16px}
#lock .err{color:var(--neg);font-size:13px;min-height:20px;font-weight:600}
.lock-ico{width:56px;height:56px;border-radius:16px;background:var(--hero);color:#fff;display:inline-grid;place-items:center}
.spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

@media (max-width:1060px){.pl{grid-template-columns:1fr}.quote{position:static}}

    <div class="bar-row" title="${esc(r.name)}: ${fmt(r.value)}">
      <div class="name">${esc(r.name)}</div>
      <div class="track"><div class="fill" data-w="${pct(r.value,max)}" style="background:${color(r,i)}"></div></div>
      <div class="amt">${showPct ? `<span class="pct">${pct(r.value,total).toFixed(1)}%</span>` : ''}<span class="num">${fmtP(r.value)}</span></div>

  const donut = (() => {
    const size = 180, c = 90, r = 70, sw = 22, C = 2 * Math.PI * r; let off = 0;

      const s = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col(i)}" stroke-width="${sw}"
        stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"><title>${esc(x.name)}: ${fmt(x.value)}</title></circle>`;

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="توزيع المستحقات">

    <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--pos)"></span>نسبة التغطية</div>
      <div class="val"><span class="num">${TD ? (TR/TD).toFixed(2) + '×' : '—'}</span></div><div class="hint">المستحق يغطي الالتزامات ${TD ? (TR/TD).toFixed(1) : '—'} مرة</div></div>

      <div class="eq"><span>المستحق <b class="num">${fmt(TR)}</b></span><span>−</span>
        <span>الالتزامات <b class="num neg">${fmt(TD)}</b></span><span>=</span><span>الصافي <b class="num pos">${fmt(NET)}</b></span></div></div>
    <div class="card"><h2>الالتزامات (المطلوب مني)</h2><div class="desc">من الأكبر للأصغر</div>${bars(DB, TD, () => 'var(--neg)')}</div>
  </section>
  ${cos.length ? `<h3 class="sec">تفاصيل الشركات</h3><section class="grid g-3">${cos.map(company).join('')}</section>` : ''}

    <div class="tbl-wrap"><table data-table="all"><thead><tr><th>الجهة</th><th>النوع</th><th class="v">المبلغ</th><th class="v">النسبة</th></tr></thead><tbody>
    ${R.map(r => `<tr><td>${esc(r.name)}</td><td><span class="tag ${r.type==='company'?'co':'pe'}">${r.type==='company'?'شركة — لي':'فرد — لي'}</span></td>
      <td class="num">${fmt(r.value)}</td><td class="num">${pct(r.value,TR).toFixed(1)}%</td></tr>`).join('')}
    <tr class="tot keep"><td>إجمالي المستحق</td><td></td><td class="num">${fmt(TR)}</td><td></td></tr>
    ${DB.map(r => `<tr><td>${esc(r.name)}</td><td><span class="tag db">التزام علي</span></td>
      <td class="num neg">(${fmt(r.value)})</td><td class="num">${pct(r.value,TD).toFixed(1)}%</td></tr>`).join('')}
    <tr class="tot keep"><td>إجمالي الالتزامات</td><td></td><td class="num neg">(${fmt(TD)})</td><td></td></tr>
    <tr class="tot keep"><td>الصافي</td><td></td><td class="num pos" style="font-size:16px">${fmt(NET)}</td><td></td></tr></tbody></table></div>
  </section>`;
}

// ------------------------------------------------------------ generic workbook
// calc-card numbers are editable for what-if; nothing is written back to Excel
const GEN = [];
const clone = o => JSON.parse(JSON.stringify(o));
const fmtIn = n => n.toLocaleString('en-US', {maximumFractionDigits: 2});
const parseIn = s => { const v = parseFloat(String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,\s]/g, '')); return isNaN(v) ? 0 : v; };
const isDirty = (s, o) => s.regions.some((r,ri) => r.kind === 'calc' && r.parts.some((p,pi) => p.value !== o.regions[ri].parts[pi].value));

// a table with a "سعر" column is a price list: item name (النوع), unit (البند), price, notes
const txt = c => !c ? '' : 's' in c ? c.s : fmtIn(c.n);
function priceCols(r){
  if (r.kind !== 'table') return null;
  const c = r.columns.map(h => String(h).trim());
  const price = c.findIndex(h => h.includes('سعر'));
  if (price < 0) return null;
  const textIdx = c.map((h,i) => i).filter(i => i !== price && r.rows.some(x => x[i] && 's' in x[i]));
  const notes = c.findIndex(h => h.includes('ملاحظ'));
  const name = c.indexOf('النوع') >= 0 ? c.indexOf('النوع') : textIdx[0];
  const unit = c.indexOf('البند') >= 0 && c.indexOf('البند') !== name ? c.indexOf('البند')
    : textIdx.find(i => i !== name && i !== notes);
  return {price, name, unit, notes};
}
const priceItems = r => { const p = priceCols(r);
  return r.rows.map(x => ({name: txt(x[p.name]), unit: p.unit >= 0 && p.unit !== undefined ? txt(x[p.unit]) : '',
    price: x[p.price] && 'n' in x[p.price] ? x[p.price].n : null, note: p.notes >= 0 ? txt(x[p.notes]) : ''})).filter(i => i.name); };

function priceKpis(g){
  const items = GEN[g].D.sheets.flatMap(s => s.regions.filter(priceCols).flatMap(priceItems));
  if (!items.length) return '';
  const priced = items.filter(i => i.price !== null), missing = items.filter(i => i.price === null);
  const top = priced.reduce((a,i) => !a || i.price > a.price ? i : a, null);
  const avg = priced.length ? priced.reduce((s,i) => s + i.price, 0) / priced.length : 0;
  return `<div class="card kpi hero"><div class="lbl">عدد البنود</div><div class="val"><span class="num">${items.length}</span></div>
      <div class="hint">${priced.length} متسعّر • ${missing.length} محتاج سعر</div></div>
    <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--pos)"></span>اكتمال التسعير</div>
      <div class="val"><span class="num">${pct(priced.length,items.length).toFixed(0)}%</span></div>
      <div class="progress" style="background:var(--surface-2)"><div data-w="${pct(priced.length,items.length)}"></div></div></div>
    <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>محتاجة سعر</div>
      <div class="val"><span class="num">${missing.length}</span></div><div class="hint">${missing.slice(0,4).map(i => esc(i.name)).join('، ') || 'كله متسعّر ✓'}${missing.length > 4 ? '…' : ''}</div></div>
    ${top ? `<div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--c2)"></span>أعلى سعر</div>
      <div class="val">${moneyP(top.price)}</div><div class="hint">${esc(top.name)}${top.unit ? ' / ' + esc(top.unit) : ''} • المتوسط ${fmtP(Math.round(avg))}</div></div>` : ''}`;
}

function genKpis(g){
  const nets = GEN[g].D.sheets.flatMap(s => (s.kpis || []).map(k => ({...k, sheet: s.name})));
  if (!nets.length) return priceKpis(g);
  const totalNet = nets.reduce((s,k) => s + k.value, 0);
  return `${nets.length > 1 ? `<div class="card kpi hero"><div class="lbl">إجمالي الصافي</div><div class="val">${money(totalNet)}</div>
      <div class="hint">${nets.length} شغلانات</div></div>` : ''}
    ${nets.map((k,i) => `<div class="card kpi ${nets.length === 1 ? 'hero' : ''}"><div class="lbl"><span class="dot" style="background:${col(i)}"></span>${esc(k.label)} — ${esc(k.sheet)}</div>
      <div class="val ${k.value < 0 ? 'neg' : ''}">${money(k.value)}</div>${nets.length > 1 ? `<div class="hint">${pct(k.value,totalNet).toFixed(0)}% من إجمالي الصافي</div>` : ''}</div>`).join('')}`;
}

function genWaterfall(k){
  const top = Math.max(...k.steps.filter(s => s.sign > 0).map(s => s.value), Math.abs(k.value), 1);
  let run = 0;
  const rows = k.steps.map(s => {
    const start = Math.max(s.sign > 0 ? run : run - s.value, 0);
    run += s.sign * s.value;
    return `<div class="wf-row"><div class="name">${esc(s.label)}</div>
      <div class="track"><div class="wf-seg" style="inset-inline-start:${pct(start,top)}%;width:0" data-w="${Math.min(pct(s.value,top),100)}"
        data-bg="${s.sign > 0 ? 'var(--c1)' : 'var(--neg)'}"></div></div>
      <div class="amt num ${s.sign < 0 ? 'neg' : ''}">${s.sign < 0 ? '−' : '+'}${fmt(s.value)}</div></div>`;
  }).join('');
  return `<h2>من الإيراد للصافي</h2><div class="desc">كل خصم بيتطرح من ${esc(k.steps[0].label)} لحد ما نوصل لـ${esc(k.label)}</div>
    <div class="wf">${rows}<div class="wf-row res"><div class="name">${esc(k.label)}</div>
      <div class="track"><div class="wf-seg" style="inset-inline-start:0;width:0" data-w="${Math.min(pct(Math.abs(k.value),top),100)}"
        data-bg="${k.value < 0 ? 'var(--neg)' : 'var(--pos)'}"></div></div>
      <div class="amt num ${k.value < 0 ? 'neg' : 'pos'}" style="font-size:16px">${fmt(k.value)}</div></div></div>`;
}

// ---- price list with quote builder
const PL = {};   // id -> {items, q, f, sort}
let plSeq = 0;
function plGrid(id){
  const P = PL[id], q = norm(P.q.trim());
  let items = P.items.map((it, i) => ({...it, i}));
  if (P.f === 'priced') items = items.filter(i => i.price !== null);
  if (P.f === 'missing') items = items.filter(i => i.price === null);
  if (q) items = items.filter(i => norm(i.name + ' ' + i.unit + ' ' + i.note).includes(q));
  if (P.sort === 'hi') items.sort((a,b) => (b.price ?? -1) - (a.price ?? -1));
  if (P.sort === 'lo') items.sort((a,b) => (a.price ?? Infinity) - (b.price ?? Infinity));
  if (P.sort === 'az') items.sort((a,b) => a.name.localeCompare(b.name, 'ar'));
  if (!items.length) return `<div class="empty-state">مفيش بنود مطابقة${q ? ` لـ"${esc(P.q)}"` : ''}</div>`;
  return `<div class="pitems">${items.map(it => { const key = qKey(it), line = QUOTE.lines.find(l => l.key === key);
    return `<div class="pitem ${it.price === null ? 'empty' : ''} ${line ? 'inq' : ''}">
      <div class="pname">${hl(it.name, q)}</div>${it.unit ? `<div class="punit">لكل ${hl(it.unit, q)}</div>` : ''}
      <div class="pprice" ${it.price !== null ? `data-copy="${fmtP(it.price)}" title="دوس للنسخ"` : ''}>${it.price === null ? 'لسه مش متسعّر' : moneyP(it.price)}</div>
      ${it.note ? `<div class="pnote">${hl(it.note, q)}</div>` : ''}
      ${it.price !== null ? `<div class="pfoot">${line
        ? `<div class="stepper"><button data-qstep="-1" data-key="${esc(key)}">−</button><input class="num" inputmode="decimal" data-qty="${esc(key)}" value="${fmtIn(line.qty)}"><button data-qstep="1" data-key="${esc(key)}">+</button></div>`
        : `<button class="add" data-qadd="${id}:${it.i}">${ICON.plus}أضف للعرض</button>`}</div>` : ''}
    </div>`; }).join('')}</div>`;
}
function priceList(r){
  const id = 'pl' + (plSeq++), items = priceItems(r), priced = items.filter(i => i.price !== null);
  PL[id] = {items, q:'', f:'all', sort:'orig'};
  const seg = [['all','الكل',items.length],['priced','متسعّر',priced.length],['missing','محتاج سعر',items.length - priced.length]];
  return `<div class="full pl">
    <div class="card">
      <div class="card-head"><div><h2>${esc(r.title || 'قائمة الأسعار')}</h2><div class="desc">${priced.length} من ${items.length} بنود متسعّرة — دوس على السعر تنسخه، أو "أضف للعرض" تعمل عرض سعر</div></div></div>
      <div class="tools-row">
        ${searchBox(`data-plq="${id}"`, 'دوّر على بند أو ملاحظة…')}
        <div class="seg" data-plf="${id}">${seg.map(([k,l,n]) => `<button data-f="${k}" class="${k === 'all' ? 'on' : ''}">${l} <span class="num muted">${n}</span></button>`).join('')}</div>
        <select class="sel" data-pls="${id}" aria-label="ترتيب"><option value="orig">ترتيب الشيت</option><option value="hi">الأغلى أولاً</option><option value="lo">الأرخص أولاً</option><option value="az">أبجدي</option></select>
      </div>
      <div id="${id}">${plGrid(id)}</div>
      ${priced.length > 1 ? `<h2 style="margin-top:24px">مقارنة الأسعار</h2><div class="desc">البنود المتسعّرة من الأغلى للأرخص</div>
        ${bars(priced.slice().sort((a,b) => b.price - a.price).map(i => ({name: i.name + (i.unit ? ' / ' + i.unit : ''), value: i.price})), 0, (x,k) => col(k), false)}` : ''}
    </div>
    <aside class="card quote" data-quote></aside>
  </div>`;
}

// quote state (kept on this device only)
const qKey = it => it.name + '|' + it.unit;
let QUOTE = (() => { try { const q = JSON.parse(store.get('acc-quote')); if (q && Array.isArray(q.lines)) return q; } catch(e){} return {client:'', disc:0, lines:[]}; })();
const qSave = () => store.set('acc-quote', JSON.stringify(QUOTE));
const qSub = () => QUOTE.lines.reduce((s,l) => s + l.qty * l.price, 0);
const qDisc = () => qSub() * Math.min(Math.max(QUOTE.disc || 0, 0), 100) / 100;
const qTotal = () => qSub() - qDisc();
function quoteHTML(){
  const L = QUOTE.lines;
  return `<div class="card-head" style="margin-bottom:10px"><div><h2>عرض سعر</h2><div class="desc">${L.length ? `${L.length} بنود` : 'اختار بنود من القائمة'}</div></div>
      ${L.length ? `<button class="btn ghost" data-qclear style="padding:5px 10px;font-size:12.5px">مسح</button>` : ''}</div>
    <input class="q-field" data-qclient placeholder="اسم العميل / المشروع (اختياري)" value="${esc(QUOTE.client)}">
    ${!L.length ? `<div class="q-empty">دوس "أضف للعرض" على أي بند متسعّر، وحدّد الكمية — الإجمالي بيتحسب لوحده وتقدر تبعته واتساب.</div>` : `
    <div class="q-lines">${L.map(l => `<div class="q-line">
        <div class="qn">${esc(l.name)}</div>
        <div class="qt"><span class="num">${fmtP(l.qty * l.price)}</span><button class="q-x" data-qdel="${esc(l.key)}" title="شيل">${ICON.x}</button></div>
        <div class="qd"><input inputmode="decimal" data-qty="${esc(l.key)}" value="${fmtIn(l.qty)}"> ${esc(l.unit || 'وحدة')} × <span class="num">${fmtP(l.price)}</span></div>
      </div>`).join('')}</div>
    <div class="q-sum">
      <div><span class="muted">الإجمالي قبل الخصم</span><span class="num" data-qsub>${fmtP(qSub())}</span></div>
      <div class="disc"><span class="muted">خصم %</span><input inputmode="decimal" data-qdisc value="${QUOTE.disc || 0}"></div>
      <div class="q-grand"><span>الإجمالي</span><b data-qtot>${moneyP(Math.round(qTotal()))}</b></div>
    </div>
    <div class="q-actions">
      <button class="btn wa full" data-qwa>${ICON.wa}ابعت على واتساب</button>
      <button class="btn" data-qcopy>${ICON.copy}نسخ النص</button>
      <button class="btn" onclick="window.print()">طباعة</button>
    </div>`}`;
}
function quoteText(){
  const d = new Date(), date = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  const lines = QUOTE.lines.map((l,i) => `${i+1}) ${l.name}\n    ${fmtIn(l.qty)} ${l.unit || 'وحدة'} × ${fmtP(l.price)} = ${fmtP(l.qty * l.price)} ج.م`);
  return [`*عرض سعر*${QUOTE.client ? ' — ' + QUOTE.client : ''}`, `التاريخ: ${date}`, '', ...lines, '',
    ...(QUOTE.disc ? [`الإجمالي: ${fmtP(qSub())} ج.م`, `خصم ${QUOTE.disc}%: ${fmtP(Math.round(qDisc()))} ج.م`] : []),
    `*الإجمالي النهائي: ${fmtP(Math.round(qTotal()))} ج.م*`].join('\n');
}
function quoteRefresh(full = true){
  qSave();
  if (full) document.querySelectorAll('[data-quote]').forEach(el => el.innerHTML = quoteHTML());
  else { document.querySelectorAll('[data-qsub]').forEach(e => e.textContent = fmtP(qSub()));
    document.querySelectorAll('[data-qtot]').forEach(e => e.innerHTML = moneyP(Math.round(qTotal())));
    document.querySelectorAll('.q-line').forEach((el,i) => { const l = QUOTE.lines[i]; if (l) el.querySelector('.qt .num').textContent = fmtP(l.qty * l.price); }); }
  Object.keys(PL).forEach(id => { const el = $(id); if (el && !(el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT')) el.innerHTML = plGrid(id); });
  const has = QUOTE.lines.length && document.querySelector('.panel.on [data-quote]');
  $('qbar').classList.toggle('show', !!has);
  $('qbarN').textContent = QUOTE.lines.length; $('qbarT').innerHTML = moneyP(Math.round(qTotal()));
}
function qSetQty(key, v){
  const l = QUOTE.lines.find(x => x.key === key); if (!l) return;
  l.qty = Math.max(v, 0);
}

// ---- tables
function genSheet(g, si){
  const s = GEN[g].D.sheets[si], o = GEN[g].orig.sheets[si];
  const id = `${g}-${si}`;
  const cell = (c, emph, text, wrapT) => !c ? '<td></td>' : 'n' in c && !text
    ? `<td class="num${emph ? ' em' : ''}">${fmt(c.n)}</td>` : `<td class="${wrapT ? 'wrap-t' : ''}">${'n' in c ? fmt(c.n) : esc(c.s)}</td>`;

  const table = (r, ri) => { const text = r.columns.map((h,i) => r.rows.some(x => x[i] && 's' in x[i]));
    const longT = r.columns.map((h,i) => r.rows.some(x => x[i] && 's' in x[i] && String(x[i].s).length > 28));
    const tid = `t-${id}-${ri}`;
    return `<div class="card full">${r.title ? `<h2>${esc(r.title)}</h2><div class="desc">${r.rows.length} صف</div>` : ''}
    ${r.rows.length > 6 ? `<div class="tools-row">${searchBox(`data-ftable="${tid}"`, 'دوّر في الجدول…')}</div>` : ''}
    <div class="tbl-wrap"><table data-table="${tid}"><thead><tr>${r.columns.map((h,i) => `<th class="${text[i] ? '' : 'v'}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
    ${r.rows.map(x => `<tr>${x.map((c,i) => cell(c, (r.emph || []).includes(i), text[i], longT[i])).join('')}</tr>`).join('')}
    ${r.totals ? `<tr class="tot keep">${r.columns.map((h,i) => i === 0 ? '<td>الإجمالي</td>' :
        (i in r.totals ? `<td class="num em">${fmt(r.totals[i])}</td>` : '<td></td>')).join('')}</tr>` : ''}</tbody></table></div></div>`; };

  const calcBars = r => r.op === '+' ? bars(r.parts.map(p => ({name: p.label, value: p.value})), r.total, (x,i) => col(i)) : '';
  const calc = (r, ri) => `<div class="card"><h2>${esc(r.title || r.total_label)}</h2>
    <div class="desc">${r.op === 'x' ? 'حاصل ضرب' : 'مجموع'} البنود — دوس على أي رقم وغيّره تجرّب</div>
    <div class="calc">${r.parts.map((p,pi) => `${pi ? `<span class="op">${r.op === 'x' ? '×' : '+'}</span>` : ''}
      <label class="part"><small>${esc(p.label)}</small><input class="part-in${p.value !== o.regions[ri].parts[pi].value ? ' changed' : ''}"
        inputmode="decimal" value="${fmtIn(p.value)}" style="width:${fmtIn(p.value).length + 3}ch"
        data-g="${g}" data-s="${si}" data-r="${ri}" data-p="${pi}" title="الأصلي: ${fmtIn(o.regions[ri].parts[pi].value)}"></label>`).join('')}</div>
    <div id="gb-${id}-${ri}">${calcBars(r)}</div>
    <div class="calc-total" style="${r.op === '+' ? 'margin-top:14px' : ''}"><span>${esc(r.total_label)}</span>
      <b id="gt-${id}-${ri}" class="${r.total !== o.regions[ri].total ? 'chg' : ''}">${money(r.total)}</b></div></div>`;

  return `<h3 class="sec">${esc(s.name)}</h3>
    <div class="whatif" id="gx-${id}" style="${isDirty(s, o) ? '' : 'display:none'}">
      <span>⚠ أرقام تجريبية — مش متسجّلة في الإكسل</span><button class="btn" data-reset="${id}">رجّع الأرقام الأصلية</button></div>
    <section class="grid g-auto">
      ${(s.kpis || []).map((k,ki) => k.steps ? `<div class="card full" id="gw-${id}-${ki}">${genWaterfall(k)}</div>` : '').join('')}
      ${s.regions.map((r,ri) => r.kind === 'calc' ? calc(r, ri) : priceCols(r) ? priceList(r) : table(r, ri)).join('')}
    </section>`;
}

function renderGeneric(D){
  const g = GEN.length;
  GEN.push({D: clone(D), orig: D});
  return `<section class="kpis" id="gk-${g}">${genKpis(g)}</section>` +
    D.sheets.map((s,si) => `<div id="gs-${g}-${si}">${genSheet(g, si)}</div>`).join('');
}

function genRecompute(g, si){
  const s = GEN[g].D.sheets[si], o = GEN[g].orig.sheets[si], id = `${g}-${si}`;
  s.regions.forEach((r,ri) => {
    if (r.kind !== 'calc') return;
    r.total = r.op === 'x' ? r.parts.reduce((a,p) => a * p.value, 1) : r.parts.reduce((a,p) => a + p.value, 0);
    const t = $(`gt-${id}-${ri}`); t.innerHTML = money(r.total); t.classList.toggle('chg', r.total !== o.regions[ri].total);
    if (r.op === '+') { const b = $(`gb-${id}-${ri}`);
      b.innerHTML = bars(r.parts.map(p => ({name: p.label, value: p.value})), r.total, (x,i) => col(i)); animate(b); }
  });
  (s.kpis || []).forEach((k,ki) => {
    if (!k.steps) return;
    k.steps.forEach(st => { if (s.regions[st.region] && s.regions[st.region].kind === 'calc') st.value = s.regions[st.region].total; });
    k.value = k.steps.reduce((a,st) => a + st.sign * st.value, 0);
    const w = $(`gw-${id}-${ki}`); w.innerHTML = genWaterfall(k); animate(w);
  });
  const kk = $(`gk-${g}`); kk.innerHTML = genKpis(g); animate(kk);
  $(`gx-${id}`).style.display = isDirty(s, o) ? '' : 'none';
}

// ------------------------------------------------------------ events
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.classList.contains('part-in')) {
    const part = GEN[d.g].D.sheets[d.s].regions[d.r].parts[d.p];
    part.value = parseIn(t.value);
    t.style.width = (t.value.length + 3) + 'ch';
    t.classList.toggle('changed', part.value !== GEN[d.g].orig.sheets[d.s].regions[d.r].parts[d.p].value);
    genRecompute(+d.g, +d.s); return;
  }
  if (d.plq) { PL[d.plq].q = t.value; $(d.plq).innerHTML = plGrid(d.plq); return; }
  if (d.ftable !== undefined) {
    const q = norm(t.value.trim()), tb = document.querySelector(`[data-table="${CSS.escape(d.ftable)}"]`);
    tb.querySelectorAll('tbody tr').forEach(tr => { if (tr.classList.contains('keep')) { tr.style.display = q ? 'none' : ''; return; }
      tr.style.display = !q || norm(tr.textContent).includes(q) ? '' : 'none'; }); return;
  }
  if (d.qty !== undefined) { qSetQty(d.qty, parseIn(t.value)); quoteRefresh(false);
    document.querySelectorAll(`[data-qty="${CSS.escape(d.qty)}"]`).forEach(x => { if (x !== t) x.value = t.value; }); return; }
  if (d.qdisc !== undefined) { QUOTE.disc = parseIn(t.value); quoteRefresh(false); return; }
  if (d.qclient !== undefined) { QUOTE.client = t.value; qSave(); return; }
});
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.pls) { PL[d.pls].sort = e.target.value; $(d.pls).innerHTML = plGrid(d.pls); }
  if (d.qty !== undefined) { QUOTE.lines = QUOTE.lines.filter(l => l.qty > 0); quoteRefresh(); }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.classList.contains('part-in')) return;
  t.value = fmtIn(parseIn(t.value)); t.style.width = (t.value.length + 3) + 'ch';
});
document.addEventListener('focusin', e => { if (e.target.classList.contains('part-in') || e.target.dataset.qty !== undefined || e.target.dataset.qdisc !== undefined) e.target.select(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-copy]'); if (!b) return;
  const d = b.dataset;
  if (d.reset) {
    const [g, si] = d.reset.split('-').map(Number);
    GEN[g].D.sheets[si] = clone(GEN[g].orig.sheets[si]);
    const box = $(`gs-${d.reset}`); box.innerHTML = genSheet(g, si); animate(box);
    $(`gk-${g}`).innerHTML = genKpis(g); quoteRefresh(); return;
  }
  if (d.copy) { copyText(d.copy); return; }
  if (b.parentElement && b.parentElement.dataset.plf) { const id = b.parentElement.dataset.plf; PL[id].f = d.f;
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $(id).innerHTML = plGrid(id); return; }
  if (d.qadd) { const [id, i] = d.qadd.split(':'); const it = PL[id].items[+i], key = qKey(it);
    if (!QUOTE.lines.find(l => l.key === key)) QUOTE.lines.push({key, name: it.name, unit: it.unit, price: it.price, qty: 1});
    quoteRefresh(); toast('اتضاف لعرض السعر'); return; }
  if (d.qstep) { const l = QUOTE.lines.find(x => x.key === d.key); if (!l) return;
    l.qty = Math.max(0, Math.round((l.qty + +d.qstep) * 100) / 100);
    if (!l.qty) QUOTE.lines = QUOTE.lines.filter(x => x !== l);
    quoteRefresh(); return; }
  if (d.qdel) { QUOTE.lines = QUOTE.lines.filter(l => l.key !== d.qdel); quoteRefresh(); return; }
  if (d.qclear !== undefined) { if (confirm('تمسح عرض السعر؟')) { QUOTE = {client:'', disc:0, lines:[]}; quoteRefresh(); } return; }
  if (d.qcopy !== undefined) { copyText(quoteText()); return; }
  if (d.qwa !== undefined) { window.open('https://wa.me/?text=' + encodeURIComponent(quoteText()), '_blank', 'noopener'); return; }
});
$('qbar').onclick = () => { const q = document.querySelector('.panel.on [data-quote]'); if (q) q.scrollIntoView({behavior:'smooth', block:'start'}); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    const s = document.querySelector('.panel.on .search input'); if (s) { e.preventDefault(); s.focus(); } }
});

// ------------------------------------------------------------ boot
function animate(scope){
  requestAnimationFrame(() => setTimeout(() => scope.querySelectorAll('[data-w]').forEach(e => {
    if (e.dataset.bg) e.style.background = e.dataset.bg;
    e.style.width = e.dataset.w + '%';
  }), 60));
}

function boot(DOC){
  $('lock').style.display = 'none';
  $('app').style.display = 'block';
  $('meta').textContent = `آخر تحديث: ${DOC.generated}`;
  const tabs = $('tabs'), panels = $('panels');
  DOC.tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab'; b.textContent = t.title; b.dataset.id = t.id;
    b.onclick = () => show(t.id);
    tabs.appendChild(b);
    const p = document.createElement('section');
    p.className = 'panel'; p.id = 'p-' + t.id;
    let body;
    try { body = t.kind === 'receivables' ? renderReceivables(t.data) : renderGeneric(t.data); }
    catch (err) { console.error(err); body = `<div class="empty-state">مقدرتش أعرض التاب ده — شكل البيانات اتغيّر</div>`; }
    p.innerHTML = `<div class="panel-meta"><span class="src">${ICON.file}${esc(t.source)} • آخر تعديل: ${esc(t.modified)}</span>
      ${t.edit_url ? `<a class="btn primary" href="${esc(t.edit_url)}" target="_blank" rel="noopener">${ICON.edit}تعديل الشيت</a>` : ''}</div>` + body +
      `<footer>البيانات متشفّرة ومفيش حاجة بتتبعت لأي سيرفر • عرض السعر محفوظ على الجهاز ده بس</footer>`;
    panels.appendChild(p);
  });
  function show(id){
    if (!$('p-' + id)) id = DOC.tabs[0].id;
    tabs.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    panels.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + id));
    store.set('acc-tab', id); history.replaceState(null, '', '#' + id);
    const on = tabs.querySelector('.tab.on'); if (on) on.scrollIntoView({inline:'nearest', block:'nearest'});
    window.scrollTo({top:0});
    animate($('p-' + id)); quoteRefresh();
  }
  show(location.hash.slice(1) || store.get('acc-tab'));
}

// ------------------------------------------------------------ decryption
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(P, pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// ------------------------------------------------------------ live refresh
const LIVE = {pw:null, ct:null, generated:'', pending:null, checking:false};
// never re-render under someone who is typing, searching or running a what-if
const liveBusy = () => { const a = document.activeElement;
  return /INPUT|TEXTAREA|SELECT/.test(a ? a.tagName : '') || [...document.querySelectorAll('.search input')].some(i => i.value)
    || GEN.some(x => x.D.sheets.some((s,i) => isDirty(s, x.orig.sheets[i]))); };
function liveApply(){
  const doc = LIVE.pending; if (!doc) return;
  if (liveBusy()) { $('meta').textContent = `آخر تحديث: ${LIVE.generated} • فيه تحديث جديد هيظهر لما تخلّص`; return; }
  const y = window.scrollY;
  LIVE.pending = null; LIVE.generated = doc.generated;
  GEN.length = 0; Object.keys(PL).forEach(k => delete PL[k]);
  $('tabs').innerHTML = ''; $('panels').innerHTML = '';
  boot(doc);
  window.scrollTo({top:y});
  toast('البيانات اتحدّثت');
}
async function liveCheck(){
  if (LIVE.checking || document.hidden) return;
  LIVE.checking = true;
  try {
    // the query string gets past the Pages CDN, which otherwise caches the page for minutes
    const r = await fetch(`${location.pathname}?live=${Date.now()}`, {cache:'no-store'});
    const m = r.ok && (await r.text()).match(/^const PAYLOAD = (\{.*\});\r?$/m);
    if (m) {
      const P = JSON.parse(m[1]);
      if (P.ct !== LIVE.ct) {
        LIVE.ct = P.ct;
        const doc = await decrypt(P, LIVE.pw).catch(() => null);
        if (!doc) { location.reload(); return; }   // password changed
        if (doc.generated >= LIVE.generated) LIVE.pending = doc;   // a CDN node can briefly serve an older copy
      }
    }
    liveApply();
  } catch (e) { console.warn('live refresh', e); }
  finally { LIVE.checking = false; }
}
function liveStart(pw, doc){
  Object.assign(LIVE, {pw, ct: PAYLOAD.ct, generated: doc.generated});
  setInterval(liveCheck, 60000);
  document.addEventListener('visibilitychange', liveCheck);
  window.addEventListener('online', liveCheck);
}

$('pwEye').onclick = () => { const i = $('pw'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus(); };
if (PAYLOAD && PAYLOAD.enc) {
  $('logoutBtn').style.display = '';
  $('logoutBtn').onclick = () => { store.del('acc-pw'); location.reload(); };
  const go = $('goBtn');
  const tryOpen = async (pw, silent) => {
    if (!silent) { go.disabled = true; go.innerHTML = '<span class="spin"></span> بفك التشفير…'; }
    try { const doc = await decrypt(PAYLOAD, pw);
      if ($('remember').checked || silent) store.set('acc-pw', pw);
      boot(doc); liveStart(pw, doc); return true;
    } catch (e) {
      if (!silent) { $('pwErr').textContent = 'الباسورد غلط'; const f = $('lockForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('pw').select(); }
      return false;
    } finally { go.disabled = false; go.textContent = 'فتح'; }
  };
  $('lockForm').onsubmit = e => { e.preventDefault(); $('pwErr').textContent = ''; tryOpen($('pw').value, false); };
  const saved = store.get('acc-pw');
  (saved ? tryOpen(saved, true) : Promise.resolve(false)).then(ok => { if (!ok) { store.del('acc-pw'); $('lock').style.display = 'flex'; $('pw').focus(); } });
} else {
  boot(PAYLOAD);
}
</script>
